[project]
site_name = "NativeHTMLKit"
site_description = "Native desktop HTML/CSS apps from Python, PowerShell and the CLI"
site_url = "https://nativehtmlkit.github.io/nativehtmlkit/"
docs_dir = "docs"
site_dir = "site"
strict = true
repo_url = "https://github.com/nativehtmlkit/nativehtmlkit"

[project.theme]
features = ["navigation.instant", "navigation.sections", "navigation.top", "search.suggest"]

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "blue"
